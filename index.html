<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Cloud Аудио-тренажёр (Supabase)</title>
    <script src="sb_publishable_buNcB1Gf3j4R0z68CwTSgQ__WHMuxFY"></script>
    <!-- Подключаем официальный клиент Supabase -->
    <script src="oxinddpmnblggssmcpbc"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div class="w-full max-w-xl bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
        <!-- Шапка -->
        <div class="bg-emerald-700 p-5 text-white flex justify-between items-center">
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-xl font-bold">Cloud Тренажёр (EN ⇄ RU)</h1>
                    <span id="db-status" class="text-[10px] bg-emerald-900 text-emerald-200 px-2 py-0.5 rounded-full">Подключение...</span>
                </div>
                <p class="text-emerald-100 text-xs">Синхронизация с Supabase + HD озвучка</p>
            </div>
            <button onclick="testAudio()" class="bg-emerald-600 hover:bg-emerald-500 text-xs px-3 py-2 rounded-xl font-semibold transition flex items-center gap-1 shadow-sm border border-emerald-500">
                🔊 Тест голоса
            </button>
        </div>

        <!-- ЭКРАН 1: ПАПКИ И НАСТРОЙКИ -->
        <div id="setup-screen" class="p-6 space-y-5">
            
            <!-- Выбор и создание папки -->
            <div class="space-y-2">
                <div class="flex justify-between items-center">
                    <label class="text-sm font-semibold text-slate-700">Облачные папки:</label>
                    <span id="total-words-badge" class="text-xs text-slate-500 font-medium">Загрузка...</span>
                </div>
                <div class="flex gap-2">
                    <select id="folder-select" onchange="selectFolder()" class="flex-1 p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-medium text-slate-700 focus:ring-2 focus:ring-emerald-500 outline-none">
                    </select>
                    <button onclick="createNewFolder()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3.5 py-2 rounded-xl font-semibold transition" title="Создать папку">
                        + Папка
                    </button>
                    <button onclick="deleteCurrentFolder()" class="bg-rose-100 hover:bg-rose-200 text-rose-600 px-3 py-2 rounded-xl font-semibold transition" title="Удалить папку">
                        ✕
                    </button>
                </div>
            </div>

            <!-- Добавление слов -->
            <div class="space-y-2 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                <label class="block text-sm font-semibold text-slate-700">Добавить слова в облако:</label>
                <p class="text-xs text-slate-500">Формат: <b>английское слово - русский перевод</b> (каждое с новой строки)</p>
                <textarea id="bulk-input" rows="3" placeholder="apple - яблоко
achieve - достигать
confidence - уверенность" class="w-full p-3 bg-white border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 outline-none resize-none"></textarea>
                <button id="save-btn" onclick="addWords()" class="w-full bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold py-2.5 rounded-xl transition">
                    ☁️ Сохранить в Supabase
                </button>
            </div>

            <!-- Список слов текущей папки -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-semibold text-slate-700">Слова в этой папке:</span>
                    <button onclick="clearFolderWords()" class="text-xs text-rose-500 hover:underline">Очистить папку</button>
                </div>
                <div id="words-list" class="max-h-36 overflow-y-auto space-y-1.5 pr-1">
                </div>
            </div>

            <hr class="border-slate-200">

            <!-- Направление перевода -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Направление диктовки:</label>
                <select id="direction-select" class="w-full p-2.5 bg-emerald-50 border border-emerald-200 text-emerald-900 rounded-xl text-sm font-bold outline-none">
                    <option value="en-ru">🇬🇧 Английский ➔ 🇷🇺 Русский (сначала EN, через паузу RU)</option>
                    <option value="ru-en">🇷🇺 Русский ➔ 🇬🇧 Английский (сначала RU, через паузу EN)</option>
                </select>
            </div>

            <!-- Пауза и режим цикла -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Пауза на раздумье:</label>
                    <select id="delay-select" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium outline-none">
                        <option value="3">3 секунды</option>
                        <option value="5" selected>5 секунд</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Повторение списка:</label>
                    <select id="mode-select" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium outline-none">
                        <option value="once">Один круг (до конца папки)</option>
                        <option value="loop">По кругу (пока не остановлю)</option>
                    </select>
                </div>
            </div>

            <div class="flex items-center justify-between text-sm text-slate-600 px-1">
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" id="shuffle-check" class="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4">
                    <span>Перемешать слова</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" id="hide-answer-check" checked class="rounded text-emerald-600 focus:ring-emerald-500 w-4 h-4">
                    <span>Скрывать ответ до озвучки</span>
                </label>
            </div>

            <!-- Кнопка запуска -->
            <button onclick="startTraining()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-emerald-200 transition text-base">
                ▶ Начать тренировку
            </button>
        </div>

        <!-- ЭКРАН 2: ТРЕНИРОВКА -->
        <div id="training-screen" class="p-6 space-y-6 hidden text-center">
            <div class="flex justify-between items-center text-xs font-semibold text-slate-400 uppercase tracking-wider">
                <span id="active-folder-title">Папка №1</span>
                <span id="direction-badge" class="text-emerald-600">EN ➔ RU</span>
                <span id="progress-counter">1 / 10</span>
            </div>

            <!-- Карточка текущего слова -->
            <div class="bg-emerald-50/70 border border-emerald-100 rounded-3xl p-8 space-y-4 min-h-[230px] flex flex-col justify-center items-center relative">
                <div id="status-badge" class="text-xs font-semibold px-3 py-1 rounded-full bg-emerald-200 text-emerald-900">
                    Слушайте слово...
                </div>
                
                <div id="prompt-word" class="text-3xl font-extrabold text-slate-800 tracking-wide">
                    ...
                </div>
                
                <div id="answer-word" class="text-xl font-bold text-emerald-600 transition-all duration-300 min-h-[28px]">
                    ...
                </div>

                <!-- Визуальный таймер -->
                <div class="w-full max-w-xs pt-2">
                    <div class="flex justify-between text-xs text-slate-500 mb-1">
                        <span id="timer-label">Ответ через:</span>
                        <span id="timer-seconds" class="font-bold text-emerald-700">5 с</span>
                    </div>
                    <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                        <div id="timer-bar" class="bg-emerald-600 h-2 rounded-full transition-all duration-100" style="width: 100%"></div>
                    </div>
                </div>
            </div>

            <!-- Кнопки управления -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="repeatCurrentWord()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2">
                    🔊 Повторить пару
                </button>
                <button onclick="skipToNext()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2">
                    ⏭ Следующее
                </button>
            </div>

            <button onclick="stopTraining()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-rose-200 transition">
                ⏹ Закончить тренировку
            </button>
        </div>

    </div>

    <script>
        // =====================================================================
        // ВСТАВЬТЕ ВАШИ ДАННЫЕ ИЗ SUPABASE (Project Settings -> API)
        // =====================================================================
        const SUPABASE_URL = 'https://ВАШ_ПРОЕКТ.supabase.co';
        const SUPABASE_KEY = 'ВАШ_ANON_PUBLIC_KEY';
        // =====================================================================

        let supabaseClient = null;
        let foldersMap = { "Папка №1": [] };
        let currentFolder = "Папка №1";
        
        let trainingQueue = [];
        let currentIndex = 0;
        let isTraining = false;
        let countdownInterval = null;
        let nextStepTimeout = null;
        
        const audioCache = new Map();
        let activeAudio = null;

        // Инициализация подключения к Supabase
        async function initSupabase() {
            const statusBadge = document.getElementById('db-status');
            if (SUPABASE_URL.includes('ВАШ_ПРОЕКТ')) {
                statusBadge.textContent = "Нет ключей API";
                statusBadge.className = "text-[10px] bg-amber-500 text-white px-2 py-0.5 rounded-full";
                renderUI();
                return;
            }

            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                await loadFromDatabase();
                statusBadge.textContent = "Онлайн (БД)";
                statusBadge.className = "text-[10px] bg-emerald-500 text-white px-2 py-0.5 rounded-full";
            } catch (err) {
                console.error("Ошибка Supabase:", err);
                statusBadge.textContent = "Ошибка БД";
                statusBadge.className = "text-[10px] bg-rose-500 text-white px-2 py-0.5 rounded-full";
            }
        }

        // Загрузка всех слов и папок из таблицы Supabase
        async function loadFromDatabase() {
            if (!supabaseClient) return;

            const { data, error } = await supabaseClient
                .from('words_dictation')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                alert("Ошибка загрузки из Supabase: " + error.message);
                return;
            }

            // Группируем записи по папкам
            const grouped = {};
            if (data && data.length > 0) {
                data.forEach(row => {
                    if (!grouped[row.folder_name]) {
                        grouped[row.folder_name] = [];
                    }
                    grouped[row.folder_name].push({
                        id: row.id,
                        en: row.word_en,
                        ru: row.word_ru || '',
                        audioEnUrl: row.audio_en_url, // Поддержка студийных MP3 из базы
                        audioRuUrl: row.audio_ru_url
                    });
                });
                foldersMap = grouped;
                if (!foldersMap[currentFolder]) {
                    currentFolder = Object.keys(foldersMap)[0];
                }
            } else {
                foldersMap = { "Папка №1": [] };
                currentFolder = "Папка №1";
            }

            renderUI();
        }

        function renderUI() {
            const select = document.getElementById('folder-select');
            select.innerHTML = '';
            
            const folderNames = Object.keys(foldersMap);
            folderNames.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = `${name} (${foldersMap[name].length})`;
                if (name === currentFolder) option.selected = true;
                select.appendChild(option);
            });

            const listContainer = document.getElementById('words-list');
            listContainer.innerHTML = '';
            const words = foldersMap[currentFolder] || [];
            
            document.getElementById('total-words-badge').textContent = `${words.length} слов`;

            if (words.length === 0) {
                listContainer.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Папка пуста. Добавьте слова выше.</p>';
                return;
            }

            words.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-slate-50 px-3 py-2 rounded-xl border border-slate-100 text-sm';
                div.innerHTML = `
                    <div>
                        <span class="font-bold text-slate-800">${item.en}</span>
                        <span class="text-slate-500"> — ${item.ru || '<i class="text-rose-400 text-xs">нет перевода</i>'}</span>
                        ${item.audioEnUrl ? '<span class="ml-1 text-[10px] bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded">HD MP3</span>' : ''}
                    </div>
                    <button onclick="deleteWord('${item.id}')" class="text-slate-400 hover:text-rose-500 px-2 font-bold">✕</button>
                `;
                listContainer.appendChild(div);
            });
        }

        function selectFolder() {
            currentFolder = document.getElementById('folder-select').value;
            renderUI();
        }

        function createNewFolder() {
            const nextNum = Object.keys(foldersMap).length + 1;
            const name = prompt("Введите название новой папки:", `Папка №${nextNum}`);
            if (name && name.trim()) {
                const cleanName = name.trim();
                if (!foldersMap[cleanName]) {
                    foldersMap[cleanName] = [];
                }
                currentFolder = cleanName;
                renderUI();
            }
        }

        async function deleteCurrentFolder() {
            if (!confirm(`Удалить папку "${currentFolder}" и все её слова из облака?`)) return;

            if (supabaseClient) {
                await supabaseClient
                    .from('words_dictation')
                    .delete()
                    .eq('folder_name', currentFolder);
            }

            delete foldersMap[currentFolder];
            if (Object.keys(foldersMap).length === 0) {
                foldersMap["Папка №1"] = [];
            }
            currentFolder = Object.keys(foldersMap)[0];
            renderUI();
        }

        async function addWords() {
            const raw = document.getElementById('bulk-input').value.trim();
            if (!raw) return;

            const btn = document.getElementById('save-btn');
            btn.textContent = "⏳ Сохранение в облако...";
            btn.disabled = true;

            const lines = raw.split('\n');
            const rowsToInsert = [];

            lines.forEach(line => {
                if (!line.trim()) return;
                const parts = line.split(/[-—]/);
                const en = parts[0].trim();
                const ru = parts.slice(1).join('-').trim();
                if (en) {
                    rowsToInsert.push({
                        folder_name: currentFolder,
                        word_en: en,
                        word_ru: ru
                    });
                }
            });

            if (rowsToInsert.length > 0) {
                if (supabaseClient) {
                    const { error } = await supabaseClient
                        .from('words_dictation')
                        .insert(rowsToInsert);
                    
                    if (error) {
                        alert("Ошибка сохранения: " + error.message);
                    } else {
                        await loadFromDatabase();
                    }
                } else {
                    // Локальный режим, если ключи ещё не вставлены
                    rowsToInsert.forEach(r => {
                        foldersMap[currentFolder].push({ id: Date.now() + Math.random(), en: r.word_en, ru: r.word_ru });
                    });
                    renderUI();
                }
            }

            document.getElementById('bulk-input').value = '';
            btn.textContent = "☁️ Сохранить в Supabase";
            btn.disabled = false;
        }

        async function deleteWord(id) {
            if (supabaseClient) {
                await supabaseClient
                    .from('words_dictation')
                    .delete()
                    .eq('id', id);
                await loadFromDatabase();
            } else {
                foldersMap[currentFolder] = foldersMap[currentFolder].filter(w => String(w.id) !== String(id));
                renderUI();
            }
        }

        async function clearFolderWords() {
            if (!confirm("Очистить все слова в этой папке?")) return;
            await deleteCurrentFolder();
        }

        // --- ОЗВУЧКА: ПОДДЕРЖКА MP3 ИЗ SUPABASE + ПРЕДЗАГРУЗКА HD ---
        function getAudioUrl(text, langCode, customUrl) {
            // Если в базе Supabase для слова прикреплена студийная запись носителя — используем её!
            if (customUrl) return customUrl;
            return `https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=${langCode}&q=${encodeURIComponent(text)}`;
        }

        function preloadAudio(text, langCode, customUrl = null) {
            if (!text || text === '—') return;
            const key = customUrl || `${langCode}:${text.toLowerCase()}`;
            if (!audioCache.has(key)) {
                const audio = new Audio();
                audio.referrerPolicy = "no-referrer";
                audio.src = getAudioUrl(text, langCode, customUrl);
                audio.preload = "auto";
                audioCache.set(key, audio);
            }
        }

        function speakSystemFallback(text, langCode, doneCallback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = langCode === 'ru' ? 'ru-RU' : 'en-US';
                utterance.rate = 0.9;
                utterance.onend = doneCallback;
                utterance.onerror = doneCallback;
                window.speechSynthesis.speak(utterance);
                setTimeout(doneCallback, 3500);
            } else {
                doneCallback();
            }
        }

        function speakText(text, langCode, customUrl, onFinishedCallback) {
            if (!text || text === '—') {
                if (onFinishedCallback) onFinishedCallback();
                return;
            }

            let finished = false;
            const done = () => {
                if (!finished) {
                    finished = true;
                    if (onFinishedCallback) onFinishedCallback();
                }
            };

            const key = customUrl || `${langCode}:${text.toLowerCase()}`;
            let audio = audioCache.get(key);

            if (!audio) {
                audio = new Audio();
                audio.referrerPolicy = "no-referrer";
                audio.src = getAudioUrl(text, langCode, customUrl);
                audioCache.set(key, audio);
            } else {
                audio.currentTime = 0;
            }

            activeAudio = audio;

            const networkTimeout = setTimeout(() => {
                if (!finished && audio.paused) {
                    audio.pause();
                    audioCache.delete(key);
                    speakSystemFallback(text, langCode, done);
                }
            }, 2200);

            audio.onplaying = () => clearTimeout(networkTimeout);
            audio.onended = () => {
                clearTimeout(networkTimeout);
                done();
            };
            audio.onerror = () => {
                clearTimeout(networkTimeout);
                audioCache.delete(key);
                speakSystemFallback(text, langCode, done);
            };

            audio.play().catch(() => {
                clearTimeout(networkTimeout);
                speakSystemFallback(text, langCode, done);
            });
        }

        function testAudio() {
            preloadAudio("Облачный тренажёр готов к работе", "ru");
            speakText("Cloud trainer is ready", "en", null, () => {
                setTimeout(() => {
                    speakText("Облачный тренажёр готов к работе", "ru", null);
                }, 300);
            });
        }

        // --- ЛОГИКА ТРЕНИРОВКИ ---
        function startTraining() {
            const words = foldersMap[currentFolder] || [];
            if (words.length === 0) {
                alert("Добавьте хотя бы одно слово в папку перед началом!");
                return;
            }

            trainingQueue = [...words];
            if (document.getElementById('shuffle-check').checked) {
                trainingQueue.sort(() => Math.random() - 0.5);
            }

            currentIndex = 0;
            isTraining = true;

            const direction = document.getElementById('direction-select').value;
            document.getElementById('direction-badge').textContent = direction === 'en-ru' ? 'EN ➔ RU' : 'RU ➔ EN';
            document.getElementById('active-folder-title').textContent = currentFolder;

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('training-screen').classList.remove('hidden');

            runStep();
        }

        function runStep() {
            if (!isTraining) return;
            clearTimers();

            const mode = document.getElementById('mode-select').value;
            if (currentIndex >= trainingQueue.length) {
                if (mode === 'loop') {
                    currentIndex = 0;
                    if (document.getElementById('shuffle-check').checked) {
                        trainingQueue.sort(() => Math.random() - 0.5);
                    }
                } else {
                    alert("Тренировка завершена! Все слова пройдены.");
                    stopTraining();
                    return;
                }
            }

            const item = trainingQueue[currentIndex];
            const direction = document.getElementById('direction-select').value;
            const hideAnswer = document.getElementById('hide-answer-check').checked;
            const delaySec = parseInt(document.getElementById('delay-select').value, 10);

            const promptText = direction === 'en-ru' ? item.en : (item.ru || item.en);
            const promptLang = direction === 'en-ru' ? 'en' : 'ru';
            const promptUrl = direction === 'en-ru' ? item.audioEnUrl : item.audioRuUrl;
            
            const answerText = direction === 'en-ru' ? (item.ru || '—') : item.en;
            const answerLang = direction === 'en-ru' ? 'ru' : 'en';
            const answerUrl = direction === 'en-ru' ? item.audioRuUrl : item.audioEnUrl;

            // Предзагрузка ответа во время паузы
            setTimeout(() => preloadAudio(answerText, answerLang, answerUrl), 400);

            document.getElementById('progress-counter').textContent = `${currentIndex + 1} / ${trainingQueue.length}`;
            document.getElementById('status-badge').textContent = "1. Слушайте слово...";
            document.getElementById('status-badge').className = "text-xs font-semibold px-3 py-1 rounded-full bg-emerald-200 text-emerald-900";
            
            document.getElementById('prompt-word').textContent = promptText;
            
            const answerEl = document.getElementById('answer-word');
            answerEl.textContent = answerText;
            if (hideAnswer) {
                answerEl.classList.add('blur-sm', 'select-none', 'opacity-40');
            } else {
                answerEl.classList.remove('blur-sm', 'select-none', 'opacity-40');
            }

            document.getElementById('timer-label').textContent = "Перевод прозвучит через:";
            document.getElementById('timer-seconds').textContent = `${delaySec} с`;
            document.getElementById('timer-bar').style.width = '100%';

            speakText(promptText, promptLang, promptUrl, () => {
                if (!isTraining) return;
                startThinkTimer(delaySec, answerText, answerLang, answerUrl);
            });
        }

        function startThinkTimer(seconds, answerText, answerLang, answerUrl) {
            document.getElementById('status-badge').textContent = "2. Вспомните перевод...";
            document.getElementById('status-badge').className = "text-xs font-semibold px-3 py-1 rounded-full bg-amber-200 text-amber-800";

            const totalMs = seconds * 1000;
            const startTime = Date.now();

            countdownInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const remaining = Math.max(0, totalMs - elapsed);
                const percent = (remaining / totalMs) * 100;

                document.getElementById('timer-bar').style.width = `${percent}%`;
                document.getElementById('timer-seconds').textContent = `${Math.ceil(remaining / 1000)} с`;

                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    revealAndSpeakAnswer(answerText, answerLang, answerUrl);
                }
            }, 100);
        }

        function revealAndSpeakAnswer(answerText, answerLang, answerUrl) {
            if (!isTraining) return;

            document.getElementById('status-badge').textContent = "3. Правильный перевод:";
            document.getElementById('status-badge').className = "text-xs font-semibold px-3 py-1 rounded-full bg-emerald-200 text-emerald-800";
            document.getElementById('timer-label').textContent = "Следующее слово...";
            document.getElementById('timer-seconds').textContent = "";

            const answerEl = document.getElementById('answer-word');
            answerEl.classList.remove('blur-sm', 'select-none', 'opacity-40');

            speakText(answerText, answerLang, answerUrl, () => {
                if (!isTraining) return;
                nextStepTimeout = setTimeout(() => {
                    currentIndex++;
                    runStep();
                }, 1500);
            });
        }

        function repeatCurrentWord() {
            if (!isTraining) return;
            runStep();
        }

        function skipToNext() {
            if (!isTraining) return;
            clearTimers();
            currentIndex++;
            runStep();
        }

        function clearTimers() {
            if (countdownInterval) clearInterval(countdownInterval);
            if (nextStepTimeout) clearTimeout(nextStepTimeout);
            if (activeAudio) activeAudio.pause();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        function stopTraining() {
            isTraining = false;
            clearTimers();
            document.getElementById('training-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }

        // Запуск инициализации при открытии страницы
        initSupabase();
    </script>
</body>
</html>
