<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аудио-словарь и тренажёр</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div class="w-full max-w-xl bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
        <!-- Шапка -->
        <div class="bg-indigo-600 p-5 text-white flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">Аудио-тренажёр слов</h1>
                <p class="text-indigo-200 text-xs">Диктовка по папкам с интервалом</p>
            </div>
            <span id="total-words-badge" class="bg-indigo-500 text-xs px-3 py-1 rounded-full font-medium">0 слов</span>
        </div>

        <!-- ЭКРАН 1: ПАПКИ И СЛОВА -->
        <div id="setup-screen" class="p-6 space-y-6">
            
            <!-- Выбор и создание папки -->
            <div class="space-y-2">
                <label class="block text-sm font-semibold text-slate-700">Выберите папку:</label>
                <div class="flex gap-2">
                    <select id="folder-select" onchange="selectFolder()" class="flex-1 p-2.5 bg-slate-50 border border-slate-300 rounded-xl font-medium text-slate-700 focus:ring-2 focus:ring-indigo-500 outline-none">
                    </select>
                    <button onclick="createNewFolder()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 px-3.5 py-2 rounded-xl font-semibold transition" title="Создать папку">
                        + Папка
                    </button>
                    <button onclick="deleteCurrentFolder()" class="bg-rose-100 hover:bg-rose-200 text-rose-600 px-3 py-2 rounded-xl font-semibold transition" title="Удалить папку">
                        ✕
                    </button>
                </div>
            </div>

            <!-- Добавление слов в выбранную папку -->
            <div class="space-y-2 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                <label class="block text-sm font-semibold text-slate-700">Добавить слова в папку:</label>
                <p class="text-xs text-slate-500">Вводите каждое слово с новой строки в формате: <b>слово - перевод</b></p>
                <textarea id="bulk-input" rows="3" placeholder="apple - яблоко&#10;achieve - достигать&#10;confidence - уверенность" class="w-full p-3 bg-white border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none resize-none"></textarea>
                <button onclick="addWords()" class="w-full bg-slate-800 hover:bg-slate-900 text-white text-sm font-semibold py-2.5 rounded-xl transition">
                    + Сохранить слова в папку
                </button>
            </div>

            <!-- Список слов текущей папки -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-semibold text-slate-700">Слова в этой папке:</span>
                    <button onclick="clearFolderWords()" class="text-xs text-rose-500 hover:underline">Очистить список</button>
                </div>
                <div id="words-list" class="max-h-40 overflow-y-auto space-y-1.5 pr-1">
                    <!-- Сюда рендерятся слова -->
                </div>
            </div>

            <hr class="border-slate-200">

            <!-- Настройки тренировки -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Пауза на раздумье:</label>
                    <select id="delay-select" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium outline-none">
                        <option value="3">3 секунды</option>
                        <option value="5" selected>5 секунд</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Режим диктовки:</label>
                    <select id="mode-select" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium outline-none">
                        <option value="once">Один круг (до конца папки)</option>
                        <option value="loop">По кругу (пока не остановлю)</option>
                    </select>
                </div>
            </div>

            <div class="flex items-center justify-between text-sm text-slate-600 px-1">
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" id="shuffle-check" class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                    <span>Перемешать слова</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" id="show-trans-check" checked class="rounded text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                    <span>Показывать перевод</span>
                </label>
            </div>

            <!-- Кнопка запуска -->
            <button onclick="startTraining()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-indigo-200 transition text-base">
                ▶ Начать диктант
            </button>
        </div>

        <!-- ЭКРАН 2: ТРЕНИРОВКА (АКТИВНЫЙ ДИКТАНТ) -->
        <div id="training-screen" class="p-6 space-y-6 hidden text-center">
            <div class="flex justify-between items-center text-xs font-semibold text-slate-400 uppercase tracking-wider">
                <span id="active-folder-title">Папка №1</span>
                <span id="progress-counter">1 / 10</span>
            </div>

            <!-- Карточка текущего слова -->
            <div class="bg-indigo-50 border border-indigo-100 rounded-3xl p-8 space-y-3 min-h-[200px] flex flex-col justify-center items-center relative">
                <div id="status-badge" class="text-xs font-semibold px-3 py-1 rounded-full bg-indigo-200 text-indigo-800 mb-2">
                    Диктую...
                </div>
                
                <div id="current-word-en" class="text-3xl font-extrabold text-slate-800 tracking-wide">
                    ...
                </div>
                
                <div id="current-word-ru" class="text-lg font-medium text-indigo-600">
                    ...
                </div>

                <!-- Визуальный таймер -->
                <div class="w-full max-w-xs mt-4">
                    <div class="flex justify-between text-xs text-slate-500 mb-1">
                        <span>Следующее слово через:</span>
                        <span id="timer-seconds" class="font-bold text-indigo-600">5 с</span>
                    </div>
                    <div class="w-full bg-slate-200 rounded-full h-2 overflow-hidden">
                        <div id="timer-bar" class="bg-indigo-600 h-2 rounded-full transition-all duration-100" style="width: 100%"></div>
                    </div>
                </div>
            </div>

            <!-- Кнопки управления во время диктанта -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="repeatCurrentWord()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2">
                    🔊 Повторить слово
                </button>
                <button onclick="skipToNext()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2">
                    ⏭ Следующее
                </button>
            </div>

            <button onclick="stopTraining()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-rose-200 transition">
                ⏹ Закончить тренировку
            </button>
        </div>

    </div>

    <!-- Резервный аудиоплеер (если встроенный синтезатор браузера не работает) -->
    <audio id="fallback-audio"></audio>

    <script>
        // Инициализация данных из localStorage
        let data = JSON.parse(localStorage.getItem('dictation_folders_v2')) || {
            "Папка №1": [
                { en: "apple", ru: "яблоко" },
                { en: "journey", ru: "путешествие" },
                { en: "knowledge", ru: "знание" }
            ],
            "Папка №2": [
                { en: "developer", ru: "разработчик" },
                { en: "success", ru: "успех" }
            ]
        };

        let currentFolder = Object.keys(data)[0] || "Папка №1";
        let trainingQueue = [];
        let currentIndex = 0;
        let isTraining = false;
        let countdownInterval = null;
        let nextWordTimeout = null;

        function saveData() {
            localStorage.setItem('dictation_folders_v2', JSON.stringify(data));
            renderUI();
        }

        function renderUI() {
            const select = document.getElementById('folder-select');
            select.innerHTML = '';
            
            const folderNames = Object.keys(data);
            if (!folderNames.includes(currentFolder) && folderNames.length > 0) {
                currentFolder = folderNames[0];
            }

            folderNames.forEach(name => {
                const option = document.createElement('option');
                option.value = name;
                option.textContent = `${name} (${data[name].length})`;
                if (name === currentFolder) option.selected = true;
                select.appendChild(option);
            });

            const listContainer = document.getElementById('words-list');
            listContainer.innerHTML = '';
            const words = data[currentFolder] || [];
            
            document.getElementById('total-words-badge').textContent = `${words.length} слов`;

            if (words.length === 0) {
                listContainer.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">В этой папке пока нет слов</p>';
                return;
            }

            words.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-slate-50 px-3 py-2 rounded-xl border border-slate-100 text-sm';
                div.innerHTML = `
                    <div>
                        <span class="font-bold text-slate-800">${item.en}</span>
                        ${item.ru ? `<span class="text-slate-500"> — ${item.ru}</span>` : ''}
                    </div>
                    <button onclick="deleteWord(${index})" class="text-slate-400 hover:text-rose-500 px-2 font-bold">✕</button>
                `;
                listContainer.appendChild(div);
            });
        }

        function selectFolder() {
            currentFolder = document.getElementById('folder-select').value;
            renderUI();
        }

        function createNewFolder() {
            const nextNum = Object.keys(data).length + 1;
            const name = prompt("Введите название папки:", `Папка №${nextNum}`);
            if (name && name.trim()) {
                const cleanName = name.trim();
                if (!data[cleanName]) {
                    data[cleanName] = [];
                }
                currentFolder = cleanName;
                saveData();
            }
        }

        function deleteCurrentFolder() {
            const keys = Object.keys(data);
            if (keys.length <= 1) {
                alert("Нельзя удалить последнюю папку!");
                return;
            }
            if (confirm(`Удалить "${currentFolder}" и все слова в ней?`)) {
                delete data[currentFolder];
                currentFolder = Object.keys(data)[0];
                saveData();
            }
        }

        function addWords() {
            const raw = document.getElementById('bulk-input').value.trim();
            if (!raw) return;

            const lines = raw.split('\n');
            lines.forEach(line => {
                if (!line.trim()) return;
                // Разделяем по тире (- или —)
                const parts = line.split(/[-—]/);
                const en = parts[0].trim();
                const ru = parts.slice(1).join('-').trim();
                if (en) {
                    data[currentFolder].push({ en, ru });
                }
            });

            document.getElementById('bulk-input').value = '';
            saveData();
        }

        function deleteWord(index) {
            data[currentFolder].splice(index, 1);
            saveData();
        }

        function clearFolderWords() {
            if (confirm("Очистить все слова в текущей папке?")) {
                data[currentFolder] = [];
                saveData();
            }
        }

        // --- ОЗВУЧКА С РЕЗЕРВНЫМ КАНАЛОМ ---
        function speakWord(text, onFinishedCallback) {
            let callbackCalled = false;
            const safeCallback = () => {
                if (!callbackCalled) {
                    callbackCalled = true;
                    if (onFinishedCallback) onFinishedCallback();
                }
            };

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;

                utterance.onend = () => safeCallback();
                utterance.onerror = () => playFallbackAudio(text, safeCallback);

                window.speechSynthesis.speak(utterance);

                // Страховка на случай, если браузер зависнет при синтезе речи
                setTimeout(() => {
                    if (!window.speechSynthesis.speaking && !callbackCalled) {
                        playFallbackAudio(text, safeCallback);
                    }
                }, 800);
            } else {
                playFallbackAudio(text, safeCallback);
            }
        }

        function playFallbackAudio(text, callback) {
            const audio = document.getElementById('fallback-audio');
            audio.src = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=en&client=tw-ob`;
            audio.onended = () => { if (callback) callback(); };
            audio.onerror = () => { if (callback) callback(); };
            audio.play().catch(() => { if (callback) callback(); });
        }

        // --- ЛОГИКА ТРЕНИРОВКИ ---
        function startTraining() {
            const words = data[currentFolder] || [];
            if (words.length === 0) {
                alert("Добавьте хотя бы одно слово в папку перед началом!");
                return;
            }

            trainingQueue = [...words];
            if (document.getElementById('shuffle-check').checked) {
                trainingQueue.sort(() => Math.random() - 0.5);
            }

            currentIndex = 0;
            isTraining = true;

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('training-screen').classList.remove('hidden');
            document.getElementById('active-folder-title').textContent = currentFolder;

            runStep();
        }

        function runStep() {
            if (!isTraining) return;
            clearTimers();

            const mode = document.getElementById('mode-select').value;
            if (currentIndex >= trainingQueue.length) {
                if (mode === 'loop') {
                    currentIndex = 0;
                    if (document.getElementById('shuffle-check').checked) {
                        trainingQueue.sort(() => Math.random() - 0.5);
                    }
                } else {
                    alert("Тренировка завершена! Все слова продиктованы.");
                    stopTraining();
                    return;
                }
            }

            const item = trainingQueue[currentIndex];
            const showTrans = document.getElementById('show-trans-check').checked;
            const delaySec = parseInt(document.getElementById('delay-select').value, 10);

            document.getElementById('progress-counter').textContent = `${currentIndex + 1} / ${trainingQueue.length}`;
            document.getElementById('status-badge').textContent = "Слушайте слово...";
            document.getElementById('status-badge').className = "text-xs font-semibold px-3 py-1 rounded-full bg-indigo-200 text-indigo-800 mb-2";
            
            document.getElementById('current-word-en').textContent = item.en;
            document.getElementById('current-word-ru').textContent = (showTrans && item.ru) ? item.ru : "";
            
            document.getElementById('timer-seconds').textContent = `${delaySec} с`;
            document.getElementById('timer-bar').style.width = '100%';

            // Произносим слово, и как только диктор закончит — запускаем таймер на раздумье
            speakWord(item.en, () => {
                if (!isTraining) return;
                startPauseTimer(delaySec);
            });
        }

        function startPauseTimer(seconds) {
            document.getElementById('status-badge').textContent = "Время подумать / записать...";
            document.getElementById('status-badge').className = "text-xs font-semibold px-3 py-1 rounded-full bg-amber-200 text-amber-800 mb-2";

            const totalMs = seconds * 1000;
            const startTime = Date.now();

            countdownInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                const remaining = Math.max(0, totalMs - elapsed);
                const percent = (remaining / totalMs) * 100;

                document.getElementById('timer-bar').style.width = `${percent}%`;
                document.getElementById('timer-seconds').textContent = `${Math.ceil(remaining / 1000)} с`;

                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    currentIndex++;
                    runStep();
                }
            }, 100);
        }

        function repeatCurrentWord() {
            if (!isTraining) return;
            clearTimers();
            const item = trainingQueue[currentIndex];
            const delaySec = parseInt(document.getElementById('delay-select').value, 10);
            
            document.getElementById('status-badge').textContent = "Повторяю...";
            speakWord(item.en, () => {
                if (isTraining) startPauseTimer(delaySec);
            });
        }

        function skipToNext() {
            if (!isTraining) return;
            clearTimers();
            currentIndex++;
            runStep();
        }

        function clearTimers() {
            if (countdownInterval) clearInterval(countdownInterval);
            if (nextWordTimeout) clearTimeout(nextWordTimeout);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            const audio = document.getElementById('fallback-audio');
            audio.pause();
        }

        function stopTraining() {
            isTraining = false;
            clearTimers();
            document.getElementById('training-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }

        // Запуск при загрузке страницы
        renderUI();
    </script>
</body>
</html>
