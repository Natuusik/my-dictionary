<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренажёр диктанта (С резервным аудио)</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-6 space-y-6">
        <h1 class="text-2xl font-bold text-center text-indigo-600">Dictation Pro (Fix)</h1>

        <!-- Настройка списка -->
        <div id="setup-screen" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Ваш список слов (по одному или через запятую):</label>
                <textarea id="words-input" rows="5" class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none resize-none">apple, banana, computer, developer, flexibility</textarea>
            </div>
            <button onclick="startDictation()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition">
                Начать диктант
            </button>
        </div>

        <!-- Экран диктанта -->
        <div id="dictation-screen" class="space-y-6 hidden">
            <div class="flex justify-between text-sm text-slate-500 font-medium">
                <span id="progress-text">Слово 1 из 5</span>
                <span id="score-text">Ошибок: 0</span>
            </div>

            <div class="flex flex-col items-center justify-center py-6 bg-indigo-50 rounded-xl space-y-4">
                <button onclick="playCurrentWord()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-full shadow-md transition flex items-center space-x-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                    </svg>
                    <span>Повторить слово</span>
                </button>
            </div>

            <div class="space-y-2">
                <input type="text" id="user-answer" placeholder="Введите услышанное слово..." class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-center text-lg" autocomplete="off">
                <button onclick="submitAnswer()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition">
                    Ответить
                </button>
            </div>
        </div>

        <!-- Экран результатов -->
        <div id="result-screen" class="space-y-4 hidden text-center">
            <h2 class="text-xl font-bold text-slate-800">Тренировка завершена!</h2>
            <p id="result-stats" class="text-slate-600"></p>
            <button onclick="resetApp()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition">
                Пройти заново
            </button>
        </div>
    </div>

    <!-- Скрытый аудиоэлемент для резервной озвучки -->
    <audio id="audio-player"></audio>

    <script>
        let words = [];
        let currentIndex = 0;
        let mistakes = 0;

        function speak(text) {
            // Сначала пробуем стандартный браузерный синтезатор
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Очищаем очередь
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9; // Чуть медленнее для удобства
                
                // Если браузер не смог сгенерировать голос, сработает ошибка -> включится Google Audio
                utterance.onerror = () => playGoogleAudio(text);
                
                window.speechSynthesis.speak(utterance);
            } else {
                // Если API вообще нет в браузере, сразу используем Google Audio
                playGoogleAudio(text);
            }
        }

        function playGoogleAudio(text) {
            const audio = document.getElementById('audio-player');
            // Официальный публичный эндпоинт Google Translate для озвучки текста
            audio.src = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=en&client=tw-ob`;
            audio.play().catch(err => {
                console.error("Не удалось воспроизвести звук:", err);
                alert("Ошибка воспроизведения звука. Проверьте интернет-соединение.");
            });
        }

        function startDictation() {
            const raw = document.getElementById('words-input').value;
            words = raw.split(/[\n,]+/).map(w => w.trim()).filter(w => w.length > 0);

            if (words.length === 0) {
                alert('Пожалуйста, введите хотя бы одно слово!');
                return;
            }

            currentIndex = 0;
            mistakes = 0;

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('dictation-screen').classList.remove('hidden');

            nextWord();
        }

        function nextWord() {
            if (currentIndex >= words.length) {
                showResults();
                return;
            }

            document.getElementById('progress-text').innerText = `Слово ${currentIndex + 1} из ${words.length}`;
            document.getElementById('score-text').innerText = `Ошибок: ${mistakes}`;
            document.getElementById('user-answer').value = '';
            
            playCurrentWord();
            document.getElementById('user-answer').focus();
        }

        function playCurrentWord() {
            if (words[currentIndex]) {
                speak(words[currentIndex]);
            }
        }

        function submitAnswer() {
            const userInput = document.getElementById('user-answer').value.trim().toLowerCase();
            const targetWord = words[currentIndex].toLowerCase();

            if (userInput !== targetWord) {
                mistakes++;
                alert(`Неверно! Правильно: "${words[currentIndex]}"`);
            }

            currentIndex++;
            nextWord();
        }

        function showResults() {
            document.getElementById('dictation-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('result-stats').innerText = `Вы прошли все слова. Допущено ошибок: ${mistakes}.`;
        }

        function resetApp() {
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        }

        // Поддержка нажатия Enter для отправки ответа
        document.getElementById('user-answer').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitAnswer();
            }
        });
    </script>
</body>
</html>
